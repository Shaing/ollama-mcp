[project]
name = "ollama-agent"
version = "0.1.0"
description = "MCP server exposing local Ollama models to Claude Code as tools"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "ollama>=0.6",
    "numpy>=1.26",
    "pydantic>=2",
]

[project.scripts]
ollama-agent = "ollama_agent.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
